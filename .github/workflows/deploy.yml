name: Build & Deploy API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/hypercore/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/daugia-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        id: push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-hypercore
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deploy/hypercore/docker-compose.yml"
          target: "${{ secrets.DEPLOY_PATH }}"
          strip_components: 2

      - name: Pull image and restart api
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            export IMAGE_TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)
            # Persist the deployed tag so a later manual `up -d` can't silently
            # roll the API to whatever :latest happens to be.
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" .env || echo "IMAGE_TAG=$IMAGE_TAG" >> .env
            docker compose pull api
            # Run migrations with the NEW image BEFORE swapping the serving
            # container, so new code never queries not-yet-migrated columns.
            # A one-off --rm container joins the compose network to reach postgres;
            # sh -c so $DATABASE_URL expands in-container. Fails the deploy if the
            # migration errors (old container keeps serving).
            docker compose run --rm --no-deps -T api sh -c 'migrate -path /app/migrations -database "$DATABASE_URL" up'
            docker compose up -d --no-deps --remove-orphans api
            docker image prune -f

      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://api.daugiavinhyen.com/api/health >/dev/null; then
              echo "API healthy"; exit 0
            fi
            echo "waiting for api... ($i)"; sleep 3
          done
          echo "API failed health check"; exit 1
