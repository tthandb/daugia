name: Build & Deploy API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/hypercore/**"
      - "!deploy/hypercore/README.md"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "backend/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/daugia-api

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: daugia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d daugia_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install converters used by tests
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/daugia_test?sslmode=disable
        run: go test -race ./...

      - name: Vulnerability scan
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        id: push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-hypercore
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Copy deploy files to VPS
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deploy/hypercore/docker-compose.yml,deploy/hypercore/backup.sh"
          target: "${{ secrets.DEPLOY_PATH }}"
          strip_components: 2

      - name: Migrate, swap, verify (roll back on failure)
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            NEW_TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)
            PREV_TAG=$(grep -E '^IMAGE_TAG=' .env | cut -d= -f2 || true)
            PREV_TAG=${PREV_TAG:-latest}

            set_tag() {
              if grep -qE '^IMAGE_TAG=' .env; then
                sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$1/" .env
              else
                echo "IMAGE_TAG=$1" >> .env
              fi
            }
            healthy() {
              for i in $(seq 1 20); do
                if docker compose exec -T api curl -fsS http://localhost:8080/api/health >/dev/null 2>&1; then
                  return 0
                fi
                sleep 3
              done
              return 1
            }

            set_tag "$NEW_TAG"
            docker compose pull api
            # Migrate with the NEW image before swapping the serving container so
            # new code never queries not-yet-migrated columns. Fails the deploy
            # if the migration errors (old container keeps serving).
            docker compose run --rm --no-deps -T api sh -c 'migrate -path /app/migrations -database "$DATABASE_URL" up'
            docker compose up -d --no-deps --remove-orphans api

            if ! healthy; then
              echo "new container unhealthy, rolling back to $PREV_TAG" >&2
              docker compose logs --tail=100 api || true
              set_tag "$PREV_TAG"
              docker compose up -d --no-deps api
              exit 1
            fi
            docker image prune -f

      - name: Smoke test (public edge)
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://api.daugiavinhyen.com/api/health >/dev/null; then
              echo "API healthy"; exit 0
            fi
            echo "waiting for api... ($i)"; sleep 3
          done
          echo "API failed health check"; exit 1
